[package]
name = "music-cast-volume-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
tray-icon = "0.24"
png = "0.18"
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
ureq = { version = "2.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
